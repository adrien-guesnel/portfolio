name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  docker-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇ Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 🔎 Check reCAPTCHA site key
        env:
          RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_RECAPTCHA_SITE }}
        run: |
          if [ -z "$RECAPTCHA_SITE_KEY" ]; then
            echo "::error::The NEXT_PUBLIC_GOOGLE_RECAPTCHA_SITE Actions variable is not set"
            exit 1
          fi

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: registry.aguesnel.fr/portfolio
          tags: |
            type=semver,pattern={{version}}

      - name: 🕒 Record build date
        id: build-info
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: 🔑 Log in to registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: registry.aguesnel.fr
          username: ci-portfolio
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 🏗️ Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_GOOGLE_RECAPTCHA_SITE=${{ vars.NEXT_PUBLIC_GOOGLE_RECAPTCHA_SITE }}
            APP_VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.build-info.outputs.date }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
