name: Staging

on:
  push:
    branches:
      - main

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker-staging-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇ Checkout code
        uses: actions/checkout@v6

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:staging

  rollout-staging:
    runs-on: ubuntu-latest
    needs: build-docker-staging-image
    timeout-minutes: 5

    steps:
      - name: 🔧 Install kubectl
        uses: azure/setup-kubectl@v4

      - name: 🔑 Set Kubernetes context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_STAGING }}

      - name: 🚀 Rollout frontend on staging
        run: kubectl rollout restart deployment/portfolio -n staging-portfolio
